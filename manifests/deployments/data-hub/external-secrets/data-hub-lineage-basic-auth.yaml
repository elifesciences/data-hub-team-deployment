---
# Login for data-hub-lineage.elifesciences.org.
# AWS Secrets Manager secret data-team/data-hub-lineage/basic-auth: {"auth": "<htpasswd line(s)>"}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: data-hub-lineage-basic-auth
  namespace: data-hub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: secret-store
    kind: ClusterSecretStore
  target:
    name: data-hub-lineage-basic-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        usersFile: "{{ .auth }}"
  dataFrom:
  - extract:
      key: data-team/data-hub-lineage/basic-auth
