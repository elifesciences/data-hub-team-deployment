apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: data-hub-lineage
  namespace: data-hub
spec:
  interval: 5m
  image: ghcr.io/elifesciences/data-hub-lineage
  # The image is private, so Flux needs the same pull secret as the Deployment.
  secretRef:
    name: data-hub-lineage-ghcr-pull
