apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: sciencebeam-parser-unstable
  namespace: sciencebeam
spec:
  interval: 5m
  image: ghcr.io/elifepathways/sciencebeam-parser_unstable
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: sciencebeam-parser-unstable
  namespace: sciencebeam
spec:
  imageRepositoryRef:
    name: sciencebeam-parser-unstable
    namespace: sciencebeam
  filterTags:
    # The timestamp must be anchored and strictly numeric: this repository also
    # publishes the computer-vision variant as <branch>-<sha>-<timestamp>-cv,
    # which an unanchored '.*' would capture as a non-numeric value and break
    # ordering for every tag.
    pattern: '^main-[a-fA-F0-9]+-(?P<ts>[0-9]{8}\.[0-9]{4})$'
    extract: '$ts'
  policy:
    numerical:
      order: asc
