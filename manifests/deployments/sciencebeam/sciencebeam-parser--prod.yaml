apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sciencebeam-parser--prod-cache
  namespace: sciencebeam
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: data-hub-gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciencebeam-parser--prod
  labels:
    app: sciencebeam-parser--prod
  namespace: sciencebeam
spec:
  selector:
    matchLabels:
      app: sciencebeam-parser--prod
  template:
    metadata:
      labels:
        app: sciencebeam-parser--prod
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: us-east-1c
      # the parser does not call the Kubernetes API
      automountServiceAccountToken: false
      containers:
      - name: sciencebeam-parser
        # image: ghcr.io/elifepathways/sciencebeam-parser:0.1.18 # {"$imagepolicy": "sciencebeam:sciencebeam-parser-stable"}
        image: ghcr.io/elifepathways/sciencebeam-parser_unstable:main-a9ba3b86-20261113.1509 # {"$imagepolicy": "sciencebeam:sciencebeam-parser-unstable"}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8070
          protocol: TCP
        startupProbe:
          httpGet:
            path: /api/isalive
            port: http
          timeoutSeconds: 5
          # 5s x 120 keeps the same 600s startup ceiling as 30s x 20, but
          # detects a started pod within 5s instead of up to 30s late.
          periodSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /api/isalive
            port: http
          timeoutSeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/isalive
            port: http
          timeoutSeconds: 5
          # Readiness only starts probing once startupProbe succeeds, so this
          # interval is added to the cold start on top of the startup probe's.
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
            ephemeral-storage: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi
            ephemeral-storage: 2Gi
        env:
        # Word conversion runs LibreOffice over the upload; off until the
        # image and the pod are hardened for untrusted documents.
        - name: SCIENCEBEAM_PARSER__DOC_TO_PDF__ENABLED
          value: 'false'
        volumeMounts:
        - name: cache
          mountPath: /root/.cache
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: sciencebeam-parser--prod-cache
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-parser--prod
  namespace: sciencebeam
spec:
  selector:
    app: sciencebeam-parser--prod
  ports:
  - port: 8070
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-parser--prod-scaler
  namespace: sciencebeam
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sciencebeam-parser-basic-auth--prod
  namespace: sciencebeam
spec:
  basicAuth:
    secret: sciencebeam-parser-basic-auth--prod
    realm: "Authentication Required"
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sciencebeam-parser--prod
  namespace: sciencebeam
  labels:
    app: sciencebeam-parser--prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.middlewares: sciencebeam-sciencebeam-parser-basic-auth-prod@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: sciencebeam-parser.elifesciences.org
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: sciencebeam-parser--prod-scaler
                port:
                  number: 8080
    - host: api.sciencebeam.org
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: sciencebeam-parser--prod-scaler
                port:
                  number: 8080
  tls:
    - hosts:
        - sciencebeam-parser.elifesciences.org
      secretName: sciencebeam-parser.elifesciences.org-tls
    - hosts:
        - api.sciencebeam.org
      secretName: api.sciencebeam.org-tls
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: sciencebeam-parser--prod
  namespace: sciencebeam
spec:
  hosts:
  - sciencebeam-parser.elifesciences.org
  - api.sciencebeam.org
  - sciencebeam-parser--prod-scaler
  pathPrefixes:
  - /
  scaleTargetRef:
    name: sciencebeam-parser--prod
    kind: Deployment
    apiVersion: apps/v1
    service: sciencebeam-parser--prod
    port: 8070
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 3600
  targetPendingRequests: 5
  timeouts:
    # conditionWait: how long the interceptor holds a request while scaling
    # from zero, BEFORE forwarding it. responseHeader below times a different
    # phase (after the request has been forwarded) and cannot cover a cold
    # start -- that confusion is what made every first request fail.
    # 300s: the AWS NLB in front of Traefik drops idle flows at 350s, and that
    # budget covers this wait plus the parser's processing -- so the NLB, not
    # the startup probe's 600s, is the ceiling.
    conditionWait: 300s
    responseHeader: 600s
