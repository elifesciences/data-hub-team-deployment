apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  labels:
    app: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
spec:
  selector:
    matchLabels:
      app: sciencebeam-grobid-metadata-enricher--prod
  template:
    metadata:
      labels:
        app: sciencebeam-grobid-metadata-enricher--prod
    spec:
      containers:
      - name: sciencebeam-grobid-metadata-enricher
        image: ghcr.io/elifepathways/sciencebeam-grobid-metadata-enricher:0.0.3 # {"$imagepolicy": "sciencebeam:sciencebeam-grobid-metadata-enricher-stable"}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          timeoutSeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          timeoutSeconds: 5
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 12
        env:
        - name: GROBID_URL
          value: http://sciencebeam-parser--prod-scaler:8080/api
        # Bounds the enricher's whole call to the parser: the parser's
        # conditionWait (300s) plus conversion. Must stay above that wait, or a
        # cold parser consumes the entire budget before any work happens.
        - name: GROBID_TIMEOUT
          value: "600"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api
              key: openai_api_key
        - name: OPENAI_MODEL
          value: gpt-4o-mini
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
spec:
  selector:
    app: sciencebeam-grobid-metadata-enricher--prod
  ports:
  - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
  labels:
    app: sciencebeam-grobid-metadata-enricher--prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-elife-oauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: sciencebeam-grobid-metadata-enricher.elifesciences.org
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: sciencebeam-grobid-metadata-enricher--prod-scaler
                port:
                  number: 8080
    - host: enricher.sciencebeam.org
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: sciencebeam-grobid-metadata-enricher--prod-scaler
                port:
                  number: 8080
  tls:
    - hosts:
        - sciencebeam-grobid-metadata-enricher.elifesciences.org
      secretName: sciencebeam-grobid-metadata-enricher.elifesciences.org-tls
    - hosts:
        - enricher.sciencebeam.org
      secretName: enricher.sciencebeam.org-tls
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod-scaler
  namespace: sciencebeam
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
spec:
  hosts:
  - sciencebeam-grobid-metadata-enricher.elifesciences.org
  - enricher.sciencebeam.org
  pathPrefixes:
  - /
  scaleTargetRef:
    name: sciencebeam-grobid-metadata-enricher--prod
    kind: Deployment
    apiVersion: apps/v1
    service: sciencebeam-grobid-metadata-enricher--prod
    port: 8000
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 3600
  targetPendingRequests: 5
  timeouts:
    # See the parser's HTTPScaledObject for what each phase covers.
    # A cold enricher hit the same 90s default as the parser did.
    conditionWait: 300s
    # enricher cold-start + parser cold-start + processing headroom
    responseHeader: 900s
