apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sciencebeam-parser--prod-cache
  namespace: sciencebeam
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: data-hub-gp3
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciencebeam-parser--prod
  labels:
    app: sciencebeam-parser--prod
  namespace: sciencebeam
spec:
  selector:
    matchLabels:
      app: sciencebeam-parser--prod
  template:
    metadata:
      labels:
        app: sciencebeam-parser--prod
    spec:
      nodeSelector:
        topology.kubernetes.io/zone: us-east-1c
      containers:
      - name: sciencebeam-parser
        # image: ghcr.io/elifepathways/sciencebeam-parser:0.1.18 # {"$imagepolicy": "sciencebeam:sciencebeam-parser-stable"}
        image: ghcr.io/elifepathways/sciencebeam-parser_unstable:main-b8c71d1f-20260922.0859
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8070
          protocol: TCP
        startupProbe:
          httpGet:
            path: /api/isalive
            port: http
          timeoutSeconds: 5
          # 5s x 120 keeps the same 600s startup ceiling as 30s x 20, but
          # detects a started pod within 5s instead of up to 30s late.
          periodSeconds: 5
          failureThreshold: 120
        livenessProbe:
          httpGet:
            path: /api/isalive
            port: http
          timeoutSeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/isalive
            port: http
          timeoutSeconds: 5
          # Readiness only starts probing once startupProbe succeeds, so this
          # interval is added to the cold start on top of the startup probe's.
          periodSeconds: 5
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        env:
        - name: SCIENCEBEAM_PARSER__SELECTABLE_PROFILES
          value: 'all'
        volumeMounts:
        - name: cache
          mountPath: /root/.cache
      volumes:
      - name: cache
        persistentVolumeClaim:
          claimName: sciencebeam-parser--prod-cache
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-parser--prod
  namespace: sciencebeam
spec:
  selector:
    app: sciencebeam-parser--prod
  ports:
  - port: 8070
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  labels:
    app: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
spec:
  selector:
    matchLabels:
      app: sciencebeam-grobid-metadata-enricher--prod
  template:
    metadata:
      labels:
        app: sciencebeam-grobid-metadata-enricher--prod
    spec:
      containers:
      - name: sciencebeam-grobid-metadata-enricher
        image: ghcr.io/elifepathways/sciencebeam-grobid-metadata-enricher:0.0.3 # {"$imagepolicy": "sciencebeam:sciencebeam-grobid-metadata-enricher-stable"}
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          timeoutSeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          timeoutSeconds: 5
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 12
        env:
        - name: GROBID_URL
          value: http://sciencebeam-parser--prod-scaler:8080/api
        # Bounds the enricher's whole call to the parser: the parser's
        # conditionWait (300s) plus conversion. Must stay above that wait, or a
        # cold parser consumes the entire budget before any work happens.
        - name: GROBID_TIMEOUT
          value: "600"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-api
              key: openai_api_key
        - name: OPENAI_MODEL
          value: gpt-4o-mini
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
spec:
  selector:
    app: sciencebeam-grobid-metadata-enricher--prod
  ports:
  - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
  labels:
    app: sciencebeam-grobid-metadata-enricher--prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.middlewares: traefik-elife-oauth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: sciencebeam-grobid-metadata-enricher.elifesciences.org
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: sciencebeam-grobid-metadata-enricher--prod-scaler
                port:
                  number: 8080
    - host: enricher.sciencebeam.org
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: sciencebeam-grobid-metadata-enricher--prod-scaler
                port:
                  number: 8080
  tls:
    - hosts:
        - sciencebeam-grobid-metadata-enricher.elifesciences.org
      secretName: sciencebeam-grobid-metadata-enricher.elifesciences.org-tls
    - hosts:
        - enricher.sciencebeam.org
      secretName: enricher.sciencebeam.org-tls
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod-scaler
  namespace: sciencebeam
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: sciencebeam-grobid-metadata-enricher--prod
  namespace: sciencebeam
spec:
  hosts:
  - sciencebeam-grobid-metadata-enricher.elifesciences.org
  - enricher.sciencebeam.org
  pathPrefixes:
  - /
  scaleTargetRef:
    name: sciencebeam-grobid-metadata-enricher--prod
    kind: Deployment
    apiVersion: apps/v1
    service: sciencebeam-grobid-metadata-enricher--prod
    port: 8000
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 900
  targetPendingRequests: 5
  timeouts:
    # See the parser's HTTPScaledObject below for what each phase covers.
    # A cold enricher hit the same 90s default as the parser did.
    conditionWait: 300s
    # enricher cold-start + parser cold-start + processing headroom
    responseHeader: 900s
---
apiVersion: v1
kind: Service
metadata:
  name: sciencebeam-parser--prod-scaler
  namespace: sciencebeam
spec:
  type: ExternalName
  externalName: keda-add-ons-http-interceptor-proxy.keda.svc.cluster.local
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sciencebeam-parser-basic-auth--prod
  namespace: sciencebeam
spec:
  basicAuth:
    secret: sciencebeam-parser-basic-auth--prod
    realm: "Authentication Required"
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sciencebeam-parser--prod
  namespace: sciencebeam
  labels:
    app: sciencebeam-parser--prod
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt"
    traefik.ingress.kubernetes.io/router.middlewares: sciencebeam-sciencebeam-parser-basic-auth-prod@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: sciencebeam-parser.elifesciences.org
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: sciencebeam-parser--prod-scaler
                port:
                  number: 8080
  tls:
    - hosts:
        - sciencebeam-parser.elifesciences.org
      secretName: sciencebeam-parser.elifesciences.org-tls
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: sciencebeam-parser--prod
  namespace: sciencebeam
spec:
  hosts:
  - sciencebeam-parser.elifesciences.org
  - sciencebeam-parser--prod-scaler
  pathPrefixes:
  - /
  scaleTargetRef:
    name: sciencebeam-parser--prod
    kind: Deployment
    apiVersion: apps/v1
    service: sciencebeam-parser--prod
    port: 8070
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 900
  targetPendingRequests: 5
  timeouts:
    # conditionWait: how long the interceptor holds a request while scaling
    # from zero, BEFORE forwarding it. responseHeader below times a different
    # phase (after the request has been forwarded) and cannot cover a cold
    # start -- that confusion is what made every first request fail.
    # 300s: the AWS NLB in front of Traefik drops idle flows at 350s, and that
    # budget covers this wait plus the parser's processing -- so the NLB, not
    # the startup probe's 600s, is the ceiling.
    conditionWait: 300s
    responseHeader: 600s
